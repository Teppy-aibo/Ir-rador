name: sector-rotation

on:
  schedule:
    - cron: "20 7 * * 1-5"   # JST 16:20（平日、大引け後）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "保存・通知せずログに出すだけ（1=はい）"
        default: "0"
      backfill_days:
        description: "過去何日分もまとめて記録するか（初回は200がおすすめ、普段は0）"
        default: "0"
  push:  # 動作確認用（あとで消す）
    branches: [claude/project-thread-5xjpq2]
    paths: [sector.py, .github/workflows/sector.yml]

permissions:
  contents: write

concurrency:
  group: sector
  cancel-in-progress: false

jobs:
  sector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance requests
      - name: Record
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SECTOR_WEBHOOK_URL: ${{ secrets.SECTOR_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || inputs.dry_run || '0' }}
          BACKFILL_DAYS: ${{ github.event_name == 'push' && '200' || inputs.backfill_days || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python sector.py
      - name: Save
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state/sector_daily.csv state/regime_daily.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "update sector"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
