name: save-5min-bars

on:
  schedule:
    - cron: "40 7 * * 1-5"   # JST 16:40（平日）
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去60日分をまとめて保存する（初回だけ 1）"
        default: "0"
      dry_run:
        description: "保存せずログに出すだけ（1=はい）"
        default: "0"
  push:  # 動作確認用（あとで消す）
    branches: [claude/project-thread-5xjpq2]
    paths: [bars.py, .github/workflows/bars.yml]

permissions:
  contents: write

concurrency:
  group: bars
  cancel-in-progress: false

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance requests pandas xlrd
      - name: Save bars
        env:
          PERIOD: ${{ inputs.backfill == '1' && '59d' || '5d' }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || inputs.dry_run || '0' }}
          LIMIT: ${{ github.event_name == 'push' && '40' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python bars.py
      - name: Commit
        if: github.event_name != 'push' && inputs.dry_run != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/bars5m state/universe.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "save 5min bars"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
