name: answer-check

on:
  # 定時実行は停止中（11/12、答え合わせはApps Scriptに移行）。戻すとき:
  #   schedule:
  #     - cron: "10 7 * * 1-5"   # JST 16:10（平日、大引け後）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discordに送らずログに出すだけ（1=はい）"
        default: "0"

permissions:
  contents: write

concurrency:
  group: ir-rador
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Review
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python review.py
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state/results.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "update results"
          git pull --rebase -X theirs || true
          git push
